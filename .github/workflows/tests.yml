name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

env:
  # swiftly (swift.org's toolchain installer) for the jobs that install Swift
  # on macOS. The versioned .pkg is pinned and checked, so a new swiftly
  # release cannot change CI unnoticed.
  SWIFTLY_VERSION: "1.2.0"
  SWIFTLY_SHA256: a1b48692b00ea6902957423473c87bee7c7f3e18c015a4a09317102f6820b987

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    env:
      # swift-format comes with the toolchain, so it is pinned with it.
      SWIFT_VERSION: "6.4"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/swiftly.pkg" "https://download.swift.org/swiftly/darwin/swiftly-$SWIFTLY_VERSION.pkg"
          echo "$SWIFTLY_SHA256  $RUNNER_TEMP/swiftly.pkg" | shasum -a 256 -c -
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --quiet-shell-followup --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes --use "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests

  test-macos:
    name: Run macOS Tests
    runs-on: macos-26
    env:
      SWIFT_VERSION: "6.4"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The runner's default Xcode ships an older Swift; install the exact
      # toolchain with swiftly.
      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/swiftly.pkg" "https://download.swift.org/swiftly/darwin/swiftly-$SWIFTLY_VERSION.pkg"
          echo "$SWIFTLY_SHA256  $RUNNER_TEMP/swiftly.pkg" | shasum -a 256 -c -
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --quiet-shell-followup --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes --use "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      # The tests read and write the runner's login keychain.
      - name: Run tests
        run: swift test

  build-simulators:
    name: Build for ${{ matrix.platform }} Simulator
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
    env:
      # swift-tools-version 6.3 needs Xcode 26.4 or later; Xcode 26.6 ships
      # Swift 6.3.3. Selected explicitly so a change of the image's default
      # Xcode cannot change the compiler or SDKs.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      # Build only: package tests on a simulator have no host app, so every
      # keychain call fails with errSecMissingEntitlement.
      - name: Build (${{ matrix.platform }} Simulator)
        run: |
          set -o pipefail
          xcodebuild build -scheme Keychain -destination "generic/platform=${{ matrix.platform }} Simulator" | tail -30

  docs:
    name: Build Documentation
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build documentation
        run: |
          set -o pipefail
          xcodebuild docbuild -scheme Keychain -destination "generic/platform=macOS" | tail -30
